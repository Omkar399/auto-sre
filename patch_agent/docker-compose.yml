version: '3.9'
services:
  gateway:
    build: ./gateway
    ports: [ "${GATEWAY_PORT:-5000}:5000" ]
    environment:
      - GATEWAY_PORT=${GATEWAY_PORT:-5000}
    networks: [ ghostnet ]

  api:
    build: ./api
    ports: [ "${API_PORT:-4000}:4000" ]
    environment:
      - NODE_ENV=development
      - API_PORT=${API_PORT:-4000}
      - BASE_PRICE=${BASE_PRICE:-100}
      - COUPON_CODE=${COUPON_CODE:-FIXME50}
      - DISCOUNT_PCT=${DISCOUNT_PCT:-0.5}
      - BUG_MODE=${BUG_MODE:-true}
      - GATEWAY_URL=${GATEWAY_URL:-http://gateway:5000}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
    depends_on: [ gateway ]
    networks: [ ghostnet ]

  web:
    build: ./web
    ports: [ "5173:5173" ]
    environment:
      - VITE_API_BASE=${VITE_API_BASE:-http://localhost:4000}
    depends_on: [ api ]
    networks: [ ghostnet ]

networks:
  ghostnet:
    driver: bridge
