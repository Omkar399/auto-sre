[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-hunting-agent"
version = "1.0.0"
description = "Autonomous bug investigation agent combining Browser Use, Daytona, and Gemini AI"
requires-python = ">=3.11"
dependencies = [
    "browser-use>=0.8.1",
    "daytona>=0.111.0",
    "google-generativeai>=0.8.0",
    "anthropic>=0.71.0",
    "python-dotenv",
]

[tool.setuptools]
py-modules = ["bug_hunting_agent", "bug_hunting_agent_tools"]

[tool.uv]
managed = true
